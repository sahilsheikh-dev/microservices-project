version: 2
updates:
  - package-ecosystem: maven
    directory: /user-service
    schedule:
      interval: weekly
    ignore:
      - dependency-name: org.springframework.boot:spring-boot-starter-parent
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  - package-ecosystem: maven
    directory: /journal-service
    schedule:
      interval: weekly
    ignore:
      - dependency-name: org.springframework.boot:spring-boot-starter-parent
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /user-service
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /journal-service
    schedule:
      interval: weekly
