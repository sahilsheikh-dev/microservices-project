name: "CodeQL Security Scanning"

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '28 10 * * 4' # Runs every Thursday

jobs:
  analyze:
    name: Analyze Java Services
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - journal-service

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Initializes the CodeQL tools to scan for Java
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: java
        build-mode: manual

    # Java setup matching your exact runtime constraints
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'maven'
        cache-dependency-path: ${{ matrix.service }}/pom.xml

    # Manually compile each subdirectory so CodeQL can trace the build
    - name: Build Service for CodeQL Analysis
      working-directory: ${{ matrix.service }}
      run: ./mvnw -B clean compile

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:java/service:${{ matrix.service }}"
