spring.application.name=UserService
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]
spring.jackson.serialization.write-dates-as-timestamps=false
server.port=${SERVER_PORT:8081}

# Database (no password default: app fails fast if unset)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/userdb}
spring.datasource.username=${DB_USERNAME:appuser}
spring.datasource.password=${DB_PASSWORD:${MYSQL_APP_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}

# Logging
spring.main.banner-mode=off
logging.level.root=${LOG_LEVEL_ROOT:info}
logging.level.org.springframework=${LOG_LEVEL_SPRING:warn}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:warn}
logging.level.org.hibernate.orm.jdbc.bind=${LOG_LEVEL_SQL_BIND:warn}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Kafka Producer
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=8000
app.kafka.topic.userCreated=${TOPIC_USER_CREATED:user-events}
user-service.failed.events=${TOPIC_USER_FAILED:user-operation-failed}

# OpenAPI / Swagger (off unless explicitly enabled)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# JWT (required, no default)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-in-ms=${JWT_EXPIRATION:3600000}
app.jwt.issuer=${JWT_ISSUER:user-service}