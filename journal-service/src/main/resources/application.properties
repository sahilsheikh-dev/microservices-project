spring.application.name=JournalService
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]
spring.jackson.serialization.write-dates-as-timestamps=false
server.port=${SERVER_PORT:8082}

# MongoDB (required, no credentials in source)
spring.data.mongodb.uri=${DB_URI:mongodb://${MONGO_USERNAME:journalapp}:${MONGO_APP_PASSWORD}@${MONGO_HOST:localhost}:${MONGO_PORT:27018}/journaldb?authSource=journaldb}

# Logging
spring.main.banner-mode=off
logging.level.root=${LOG_LEVEL_ROOT:info}
logging.level.org.springframework=${LOG_LEVEL_SPRING:warn}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Kafka Consumer
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=${GROUP_ID:journal-service-group}
spring.kafka.consumer.auto-offset-reset=earliest
app.kafka.topic.userCreated=${TOPIC_USER_CREATED:user-events}
user-service.failed.events=${TOPIC_USER_FAILED:user-operation-failed}

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Security (required, no defaults)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-in-ms=${JWT_EXPIRATION:3600000}
admin.email=${ADMIN_EMAIL:${JOURNAL_ADMIN_EMAIL:admin@example.com}}
admin.password=${ADMIN_PASSWORD:${JOURNAL_ADMIN_PASSWORD}}